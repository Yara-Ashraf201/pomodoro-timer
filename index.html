<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Timer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,800;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #05050f;
      font-family: 'Playfair Display', serif;
      overflow: hidden;
      position: relative;
      color: #c9c0a8;
      user-select: none;
    }

    .bg-gradient {
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(circle at 50% 35%, rgba(67, 52, 158, 0.28) 0%, transparent 65%),
        radial-gradient(circle at 15% 85%, rgba(201, 192, 168, 0.04) 0%, transparent 45%),
        radial-gradient(circle at 85% 15%, rgba(30, 22, 110, 0.3) 0%, transparent 50%);
      pointer-events: none;
    }

    .bg-particles {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(201, 192, 168, 0.15) 1px, transparent 1px);
      background-size: 36px 36px;
      opacity: 0.25;
      pointer-events: none;
    }

    .ambient-glow {
      position: absolute;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: rgba(201, 192, 168, 0.08);
      filter: blur(80px);
      pointer-events: none;
      transition: all 0.8s ease;
    }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      width: 100%;
      max-width: 480px;
    }

    .mode-selector {
      display: flex;
      gap: 6px;
      background: rgba(255, 255, 255, 0.025);
      padding: 6px;
      border-radius: 30px;
      border: 1px solid rgba(201, 192, 168, 0.12);
      margin-bottom: 45px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .mode-btn {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #837c72;
      background: none;
      border: none;
      padding: 9px 20px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .mode-btn:hover {
      color: #c9c0a8;
    }

    .mode-btn.active {
      color: #05050f;
      background: #c9c0a8;
      box-shadow: 0 4px 20px rgba(201, 192, 168, 0.25);
    }

    .timer-ring-wrapper {
      position: relative;
      width: 320px;
      height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 45px;
    }

    .progress-ring {
      position: absolute;
      top: 0;
      left: 0;
      transform: rotate(-90deg);
    }

    .progress-ring__circle-bg {
      stroke: rgba(201, 192, 168, 0.05);
    }

    .progress-ring__circle {
      stroke: #c9c0a8;
      stroke-dasharray: 942.48;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      filter: drop-shadow(0 0 12px rgba(201, 192, 168, 0.35));
    }

    .timer-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .time-display {
      font-size: 76px;
      font-weight: 800;
      letter-spacing: 1px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 4px 35px rgba(201, 192, 168, 0.2);
      transition: transform 0.3s ease;
    }

    .adjust-group {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .adjust-group.disabled {
      opacity: 0;
      pointer-events: none;
      transform: translateY(12px);
    }

    .adjust-btn {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #c9c0a8;
      background: rgba(201, 192, 168, 0.04);
      border: 1px solid rgba(201, 192, 168, 0.12);
      border-radius: 12px;
      padding: 5px 13px;
      cursor: pointer;
      transition: all 0.25s ease;
      backdrop-filter: blur(4px);
    }

    .adjust-btn:hover {
      background: rgba(201, 192, 168, 0.15);
      border-color: rgba(201, 192, 168, 0.3);
      transform: translateY(-2px);
    }

    .controls {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .btn-main {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #05050f;
      background: #c9c0a8;
      border: none;
      border-radius: 30px;
      padding: 15px 44px;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 6px 28px rgba(201, 192, 168, 0.2);
    }

    .btn-main:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 35px rgba(201, 192, 168, 0.35);
      background: #ded7c4;
    }

    .btn-main:active {
      transform: translateY(-1px);
    }

    .btn-icon {
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(201, 192, 168, 0.12);
      color: #c9c0a8;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      backdrop-filter: blur(8px);
    }

    .btn-icon:hover {
      background: rgba(201, 192, 168, 0.12);
      border-color: rgba(201, 192, 168, 0.3);
      transform: rotate(180deg) scale(1.05);
    }

    .btn-icon svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.02); opacity: 0.85; }
    }

    .running .time-display {
      animation: pulseGlow 3s ease-in-out infinite;
    }

    .running .ambient-glow {
      background: rgba(201, 192, 168, 0.14);
      transform: scale(1.2);
    }

    @media (max-width: 480px) {
      .timer-ring-wrapper {
        width: 270px;
        height: 270px;
      }
      
      svg.progress-ring {
        width: 270px;
        height: 270px;
      }

      circle {
        r: 125px;
        cx: 135px;
        cy: 135px;
        stroke-dasharray: 785.39;
      }

      .time-display {
        font-size: 58px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="bg-particles"></div>
  <div class="ambient-glow"></div>

  <div class="container">
    <div class="mode-selector">
      <button class="mode-btn active" onclick="setMode('pomodoro')">Focus</button>
      <button class="mode-btn" onclick="setMode('shortBreak')">Short Break</button>
      <button class="mode-btn" onclick="setMode('longBreak')">Long Break</button>
    </div>

    <div class="timer-ring-wrapper" id="timerWrapper">
      <svg class="progress-ring" width="320" height="320">
        <circle class="progress-ring__circle-bg" stroke-width="3.5" fill="transparent" r="150" cx="160" cy="160"/>
        <circle class="progress-ring__circle" id="progressCircle" stroke-width="3.5" stroke-linecap="round" fill="transparent" r="150" cx="160" cy="160"/>
      </svg>
      
      <div class="timer-content">
        <div class="time-display" id="timeDisplay">25:00</div>
        <div class="adjust-group" id="adjustGroup">
          <button class="adjust-btn" onclick="adjustTime(-5)">-5m</button>
          <button class="adjust-btn" onclick="adjustTime(5)">+5m</button>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="btn-main" id="startBtn" onclick="toggleTimer()">Start</button>
      <button class="btn-icon" title="Reset" onclick="resetTimer()">
        <svg viewBox="0 0 24 24">
          <path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const MODES = {
      pomodoro: { name: 'Focus', minutes: 25 },
      shortBreak: { name: 'Short Break', minutes: 5 },
      longBreak: { name: 'Long Break', minutes: 15 }
    };

    let currentMode = 'pomodoro';
    let totalSeconds = MODES[currentMode].minutes * 60;
    let remainingSeconds = totalSeconds;
    let isRunning = false;
    let timerId = null;
    let endTime = null;

    const timeDisplay = document.getElementById('timeDisplay');
    const startBtn = document.getElementById('startBtn');
    const adjustGroup = document.getElementById('adjustGroup');
    const timerWrapper = document.getElementById('timerWrapper');
    const circle = document.getElementById('progressCircle');
    
    let radius = circle.r.baseVal.value;
    let circumference = 2 * Math.PI * radius;

    function initCircle() {
      radius = circle.r.baseVal.value;
      circumference = 2 * Math.PI * radius;
      circle.style.strokeDasharray = `${circumference} ${circumference}`;
      updateProgress();
    }

    function setProgress(percent) {
      const offset = circumference - (percent / 100 * circumference);
      circle.style.strokeDashoffset = offset;
    }

    function updateProgress() {
      const percent = (remainingSeconds / totalSeconds) * 100;
      setProgress(percent);
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = (sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function updateDisplay() {
      timeDisplay.textContent = formatTime(remainingSeconds);
      document.title = `${formatTime(remainingSeconds)} • ${MODES[currentMode].name}`;
      updateProgress();
    }

    function tick() {
      const now = Date.now();
      remainingSeconds = Math.max(0, Math.round((endTime - now) / 1000));

      updateDisplay();

      if (remainingSeconds <= 0) {
        completeTimer();
      }
    }

    function toggleTimer() {
      if (isRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
    }

    function startTimer() {
      if (remainingSeconds <= 0) return;

      isRunning = true;
      endTime = Date.now() + (remainingSeconds * 1000);
      
      startBtn.textContent = 'Pause';
      adjustGroup.classList.add('disabled');
      timerWrapper.classList.add('running');
      document.body.classList.add('running');

      timerId = setInterval(tick, 200);
    }

    function pauseTimer() {
      isRunning = false;
      clearInterval(timerId);
      
      startBtn.textContent = 'Resume';
      timerWrapper.classList.remove('running');
      document.body.classList.remove('running');
    }

    function resetTimer() {
      pauseTimer();
      remainingSeconds = totalSeconds;
      startBtn.textContent = 'Start';
      adjustGroup.classList.remove('disabled');
      updateDisplay();
    }

    function completeTimer() {
      pauseTimer();
      startBtn.textContent = 'Start';
      adjustGroup.classList.remove('disabled');
      playNotification();
    }

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('onclick').includes(mode));
      });

      totalSeconds = MODES[mode].minutes * 60;
      resetTimer();
    }

    function adjustTime(amountMinutes) {
      if (isRunning) return;
      
      const newMinutes = Math.max(1, Math.min(120, Math.floor(totalSeconds / 60) + amountMinutes));
      totalSeconds = newMinutes * 60;
      remainingSeconds = totalSeconds;
      updateDisplay();
    }

    function playNotification() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(659.25, ctx.currentTime + 0.15);
        osc.frequency.exponentialRampToValueAtTime(783.99, ctx.currentTime + 0.3);

        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + 1.2);
      } catch (e) {}
    }

    window.addEventListener('resize', initCircle);
    initCircle();
    updateDisplay();
  </script>
</body>
</html>
