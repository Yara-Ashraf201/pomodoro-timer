<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Timer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,800;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #05050f;
      --text-main: #c9c0a8;
      --text-muted: #837c72;
      --gradient-1: rgba(67, 52, 158, 0.28);
      --gradient-2: rgba(201, 192, 168, 0.04);
      --gradient-3: rgba(30, 22, 110, 0.3);
      --particle-color: rgba(201, 192, 168, 0.15);
      --glow-color: rgba(201, 192, 168, 0.08);
      --glow-running: rgba(201, 192, 168, 0.14);
      --card-bg: rgba(255, 255, 255, 0.025);
      --border-color: rgba(201, 192, 168, 0.12);
      --border-hover: rgba(201, 192, 168, 0.3);
      --accent-bg: #c9c0a8;
      --accent-hover: #ded7c4;
      --accent-text: #05050f;
      --ring-bg: rgba(201, 192, 168, 0.05);
      --shadow-color: rgba(0, 0, 0, 0.3);
      --glow-shadow: rgba(201, 192, 168, 0.2);
      --glow-shadow-hover: rgba(201, 192, 168, 0.35);
    }

    [data-theme="light"] {
      --bg-main: #f4f1ea;
      --text-main: #2c2825;
      --text-muted: #7a736a;
      --gradient-1: rgba(180, 165, 215, 0.22);
      --gradient-2: rgba(200, 190, 170, 0.15);
      --gradient-3: rgba(150, 170, 220, 0.2);
      --particle-color: rgba(44, 40, 37, 0.08);
      --glow-color: rgba(180, 165, 215, 0.15);
      --glow-running: rgba(180, 165, 215, 0.28);
      --card-bg: rgba(255, 255, 255, 0.5);
      --border-color: rgba(44, 40, 37, 0.12);
      --border-hover: rgba(44, 40, 37, 0.3);
      --accent-bg: #2c2825;
      --accent-hover: #45403c;
      --accent-text: #f4f1ea;
      --ring-bg: rgba(44, 40, 37, 0.06);
      --shadow-color: rgba(0, 0, 0, 0.06);
      --glow-shadow: rgba(44, 40, 37, 0.12);
      --glow-shadow-hover: rgba(44, 40, 37, 0.22);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg-main);
      font-family: 'Playfair Display', serif;
      overflow: hidden;
      position: relative;
      color: var(--text-main);
      user-select: none;
      transition: background-color 0.5s ease, color 0.5s ease;
    }

    .bg-gradient {
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(circle at 50% 35%, var(--gradient-1) 0%, transparent 65%),
        radial-gradient(circle at 15% 85%, var(--gradient-2) 0%, transparent 45%),
        radial-gradient(circle at 85% 15%, var(--gradient-3) 0%, transparent 50%);
      pointer-events: none;
      transition: all 0.5s ease;
    }

    .bg-particles {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(var(--particle-color) 1px, transparent 1px);
      background-size: 36px 36px;
      opacity: 0.25;
      pointer-events: none;
    }

    .ambient-glow {
      position: absolute;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: var(--glow-color);
      filter: blur(80px);
      pointer-events: none;
      transition: all 0.8s ease;
    }

    .theme-toggle-wrapper {
      position: absolute;
      top: 30px;
      right: 30px;
      z-index: 10;
    }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      width: 100%;
      max-width: 480px;
    }

    .mode-selector {
      display: flex;
      gap: 6px;
      background: var(--card-bg);
      padding: 6px;
      border-radius: 30px;
      border: 1px solid var(--border-color);
      margin-bottom: 45px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px var(--shadow-color);
      transition: all 0.5s ease;
    }

    .mode-btn {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--text-muted);
      background: none;
      border: none;
      padding: 9px 20px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .mode-btn:hover {
      color: var(--text-main);
    }

    .mode-btn.active {
      color: var(--accent-text);
      background: var(--accent-bg);
      box-shadow: 0 4px 20px var(--glow-shadow);
    }

    .timer-ring-wrapper {
      position: relative;
      width: 320px;
      height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 45px;
    }

    .progress-ring {
      position: absolute;
      top: 0;
      left: 0;
      transform: rotate(-90deg);
    }

    .progress-ring__circle-bg {
      stroke: var(--ring-bg);
      transition: stroke 0.5s ease;
    }

    .progress-ring__circle {
      stroke: var(--text-main);
      stroke-dasharray: 942.48;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 0.4s cubic-bezier(0.4, 0, 0.2, 1), stroke 0.5s ease;
      filter: drop-shadow(0 0 12px var(--glow-shadow));
    }

    .timer-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .time-display {
      font-size: 76px;
      font-weight: 800;
      letter-spacing: 1px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 4px 35px var(--glow-shadow);
      transition: transform 0.3s ease, color 0.5s ease;
    }

    .adjust-group {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .adjust-group.disabled {
      opacity: 0;
      pointer-events: none;
      transform: translateY(12px);
    }

    .adjust-btn {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--text-main);
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 5px 13px;
      cursor: pointer;
      transition: all 0.25s ease;
      backdrop-filter: blur(4px);
    }

    .adjust-btn:hover {
      background: rgba(201, 192, 168, 0.15);
      border-color: var(--border-hover);
      transform: translateY(-2px);
    }

    .controls {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .btn-main {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent-text);
      background: var(--accent-bg);
      border: none;
      border-radius: 30px;
      padding: 15px 44px;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 6px 28px var(--glow-shadow);
    }

    .btn-main:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 35px var(--glow-shadow-hover);
      background: var(--accent-hover);
    }

    .btn-main:active {
      transform: translateY(-1px);
    }

    .btn-icon {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      backdrop-filter: blur(8px);
    }

    .btn-icon:hover {
      border-color: var(--border-hover);
      transform: scale(1.05);
    }

    .btn-icon.reset-btn:hover {
      transform: rotate(180deg) scale(1.05);
    }

    .btn-icon svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.02); opacity: 0.85; }
    }

    .running .time-display {
      animation: pulseGlow 3s ease-in-out infinite;
    }

    .running .ambient-glow {
      background: var(--glow-running);
      transform: scale(1.2);
    }

    @media (max-width: 480px) {
      .theme-toggle-wrapper {
        top: 20px;
        right: 20px;
      }

      .timer-ring-wrapper {
        width: 270px;
        height: 270px;
      }
      
      svg.progress-ring {
        width: 270px;
        height: 270px;
      }

      circle {
        r: 125px;
        cx: 135px;
        cy: 135px;
        stroke-dasharray: 785.39;
      }

      .time-display {
        font-size: 58px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="bg-particles"></div>
  <div class="ambient-glow"></div>

  <div class="theme-toggle-wrapper">
    <button class="btn-icon" id="themeToggleBtn" title="Toggle Theme" onclick="toggleTheme()">
      <svg id="sunIcon" viewBox="0 0 24 24" style="display: none;">
        <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>
      </svg>
      <svg id="moonIcon" viewBox="0 0 24 24">
        <path d="M12.3 2c.43 0 .77.35.72.78-.38 3.51.84 7.02 3.32 9.49 2.47 2.48 5.98 3.7 9.49 3.32.43-.05.78.29.78.72-.1 4.97-4.08 8.97-9.05 8.97-4.99 0-9.05-4.06-9.05-9.05 0-4.97 4-8.95 8.97-9.23z"/>
      </svg>
    </button>
  </div>

  <div class="container">
    <div class="mode-selector">
      <button class="mode-btn active" onclick="setMode('pomodoro')">Focus</button>
      <button class="mode-btn" onclick="setMode('shortBreak')">Short Break</button>
      <button class="mode-btn" onclick="setMode('longBreak')">Long Break</button>
    </div>

    <div class="timer-ring-wrapper" id="timerWrapper">
      <svg class="progress-ring" width="320" height="320">
        <circle class="progress-ring__circle-bg" stroke-width="3.5" fill="transparent" r="150" cx="160" cy="160"/>
        <circle class="progress-ring__circle" id="progressCircle" stroke-width="3.5" stroke-linecap="round" fill="transparent" r="150" cx="160" cy="160"/>
      </svg>
      
      <div class="timer-content">
        <div class="time-display" id="timeDisplay">25:00</div>
        <div class="adjust-group" id="adjustGroup">
          <button class="adjust-btn" onclick="adjustTime(-5)">-5m</button>
          <button class="adjust-btn" onclick="adjustTime(5)">+5m</button>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="btn-main" id="startBtn" onclick="toggleTimer()">Start</button>
      <button class="btn-icon reset-btn" title="Reset" onclick="resetTimer()">
        <svg viewBox="0 0 24 24">
          <path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const MODES = {
      pomodoro: { name: 'Focus', minutes: 25 },
      shortBreak: { name: 'Short Break', minutes: 5 },
      longBreak: { name: 'Long Break', minutes: 15 }
    };

    let currentMode = 'pomodoro';
    let totalSeconds = MODES[currentMode].minutes * 60;
    let remainingSeconds = totalSeconds;
    let isRunning = false;
    let timerId = null;
    let endTime = null;

    const timeDisplay = document.getElementById('timeDisplay');
    const startBtn = document.getElementById('startBtn');
    const adjustGroup = document.getElementById('adjustGroup');
    const timerWrapper = document.getElementById('timerWrapper');
    const circle = document.getElementById('progressCircle');
    const sunIcon = document.getElementById('sunIcon');
    const moonIcon = document.getElementById('moonIcon');
    
    let radius = circle.r.baseVal.value;
    let circumference = 2 * Math.PI * radius;

    function initTheme() {
      const savedTheme = localStorage.getItem('pomodoroTheme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      updateThemeIcons(savedTheme);
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('pomodoroTheme', newTheme);
      updateThemeIcons(newTheme);
    }

    function updateThemeIcons(theme) {
      if (theme === 'light') {
        sunIcon.style.display = 'none';
        moonIcon.style.display = 'block';
      } else {
        sunIcon.style.display = 'block';
        moonIcon.style.display = 'none';
      }
    }

    function initCircle() {
      radius = circle.r.baseVal.value;
      circumference = 2 * Math.PI * radius;
      circle.style.strokeDasharray = `${circumference} ${circumference}`;
      updateProgress();
    }

    function setProgress(percent) {
      const offset = circumference - (percent / 100 * circumference);
      circle.style.strokeDashoffset = offset;
    }

    function updateProgress() {
      const percent = (remainingSeconds / totalSeconds) * 100;
      setProgress(percent);
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = (sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function updateDisplay() {
      timeDisplay.textContent = formatTime(remainingSeconds);
      document.title = `${formatTime(remainingSeconds)} • ${MODES[currentMode].name}`;
      updateProgress();
    }

    function tick() {
      const now = Date.now();
      remainingSeconds = Math.max(0, Math.round((endTime - now) / 1000));

      updateDisplay();

      if (remainingSeconds <= 0) {
        completeTimer();
      }
    }

    function toggleTimer() {
      if (isRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
    }

    function startTimer() {
      if (remainingSeconds <= 0) return;

      isRunning = true;
      endTime = Date.now() + (remainingSeconds * 1000);
      
      startBtn.textContent = 'Pause';
      adjustGroup.classList.add('disabled');
      timerWrapper.classList.add('running');
      document.body.classList.add('running');

      timerId = setInterval(tick, 200);
    }

    function pauseTimer() {
      isRunning = false;
      clearInterval(timerId);
      
      startBtn.textContent = 'Resume';
      timerWrapper.classList.remove('running');
      document.body.classList.remove('running');
    }

    function resetTimer() {
      pauseTimer();
      remainingSeconds = totalSeconds;
      startBtn.textContent = 'Start';
      adjustGroup.classList.remove('disabled');
      updateDisplay();
    }

    function completeTimer() {
      pauseTimer();
      startBtn.textContent = 'Start';
      adjustGroup.classList.remove('disabled');
      playNotification();
    }

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('onclick').includes(mode));
      });

      totalSeconds = MODES[mode].minutes * 60;
      resetTimer();
    }

    function adjustTime(amountMinutes) {
      if (isRunning) return;
      
      const newMinutes = Math.max(1, Math.min(120, Math.floor(totalSeconds / 60) + amountMinutes));
      totalSeconds = newMinutes * 60;
      remainingSeconds = totalSeconds;
      updateDisplay();
    }

    function playNotification() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(659.25, ctx.currentTime + 0.15);
        osc.frequency.exponentialRampToValueAtTime(783.99, ctx.currentTime + 0.3);

        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + 1.2);
      } catch (e) {}
    }

    window.addEventListener('resize', initCircle);
    initTheme();
    initCircle();
    updateDisplay();
  </script>
</body>
</html>
