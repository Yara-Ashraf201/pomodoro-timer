<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Timer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #03040c 0%, #0f1738 40%, #1e2875 75%, #2c3cb5 100%);
      --text-color: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.6);
      --border-color: rgba(255, 255, 255, 0.15);
      --card-bg: rgba(255, 255, 255, 0.05);
      --button-hover: rgba(255, 255, 255, 0.15);
      --accent-active: #ffffff;
      --active-text: #0b112c;
      --shadow-glow: rgba(79, 110, 247, 0.3);
    }

    [data-theme="light"] {
      --bg-gradient: linear-gradient(135deg, #eef2ff 0%, #c7d2fe 40%, #a5b4fc 75%, #818cf8 100%);
      --text-color: #0f172a;
      --text-muted: rgba(15, 23, 42, 0.6);
      --border-color: rgba(15, 23, 42, 0.15);
      --card-bg: rgba(255, 255, 255, 0.4);
      --button-hover: rgba(255, 255, 255, 0.6);
      --accent-active: #0f172a;
      --active-text: #ffffff;
      --shadow-glow: rgba(99, 102, 241, 0.2);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg-gradient);
      font-family: 'Abril Fatface', serif;
      color: var(--text-color);
      overflow: hidden;
      user-select: none;
      transition: background 0.6s ease, color 0.6s ease;
      position: relative;
    }

    .top-bar {
      position: absolute;
      top: 30px;
      right: 30px;
      z-index: 10;
    }

    .theme-toggle {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }

    .theme-toggle:hover {
      background: var(--button-hover);
      transform: scale(1.05);
    }

    .theme-toggle svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 900px;
      padding: 20px;
    }

    .app-title {
      font-size: 3rem;
      font-weight: 400;
      letter-spacing: 1px;
      margin-bottom: 20px;
      text-shadow: 0 4px 20px var(--shadow-glow);
    }

    .mode-selector {
      display: flex;
      gap: 8px;
      background: var(--card-bg);
      padding: 6px;
      border-radius: 30px;
      border: 1px solid var(--border-color);
      margin-bottom: 40px;
      backdrop-filter: blur(12px);
    }

    .mode-btn {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-muted);
      background: none;
      border: none;
      padding: 8px 22px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .mode-btn:hover {
      color: var(--text-color);
    }

    .mode-btn.active {
      color: var(--active-text);
      background: var(--accent-active);
    }

    .timer-display-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
      margin-bottom: 50px;
    }

    .time-display {
      font-size: 8.5rem;
      font-weight: 400;
      letter-spacing: 2px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 8px 30px var(--shadow-glow);
    }

    .adjust-btn {
      background: none;
      border: none;
      color: var(--text-color);
      font-size: 4.5rem;
      font-weight: 300;
      cursor: pointer;
      line-height: 1;
      opacity: 0.7;
      transition: all 0.3s ease;
      padding: 10px 20px;
    }

    .adjust-btn:hover {
      opacity: 1;
      transform: scale(1.2);
    }

    .adjust-btn:disabled {
      opacity: 0.2;
      cursor: not-allowed;
      transform: none;
    }

    .controls {
      display: flex;
      gap: 40px;
      align-items: center;
    }

    .action-btn {
      font-family: 'Abril Fatface', serif;
      font-size: 2rem;
      color: var(--text-color);
      background: none;
      border: none;
      cursor: pointer;
      opacity: 0.8;
      transition: all 0.3s ease;
      letter-spacing: 1px;
      text-transform: lowercase;
    }

    .action-btn:hover {
      opacity: 1;
      transform: translateY(-2px);
      text-shadow: 0 4px 15px var(--shadow-glow);
    }

    @media (max-width: 768px) {
      .app-title { font-size: 2.2rem; }
      .timer-display-wrapper { gap: 15px; }
      .time-display { font-size: 5rem; }
      .adjust-btn { font-size: 3rem; }
      .controls { gap: 25px; }
      .action-btn { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Theme">
      <svg id="sunIcon" viewBox="0 0 24 24" style="display: none;">
        <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>
      </svg>
      <svg id="moonIcon" viewBox="0 0 24 24">
        <path d="M12.3 2c.43 0 .77.35.72.78-.38 3.51.84 7.02 3.32 9.49 2.47 2.48 5.98 3.7 9.49 3.32.43-.05.78.29.78.72-.1 4.97-4.08 8.97-9.05 8.97-4.99 0-9.05-4.06-9.05-9.05 0-4.97 4-8.95 8.97-9.23z"/>
      </svg>
    </button>
  </div>

  <div class="container">
    <h1 class="app-title">Pomodoro Timer</h1>

    <div class="mode-selector">
      <button class="mode-btn active" onclick="setMode('pomodoro')">Focus</button>
      <button class="mode-btn" onclick="setMode('shortBreak')">Short Break</button>
      <button class="mode-btn" onclick="setMode('longBreak')">Long Break</button>
    </div>

    <div class="timer-display-wrapper">
      <button class="adjust-btn" id="minusBtn" onclick="adjustTime(-1)">—</button>
      <div class="time-display" id="timeDisplay">24:00</div>
      <button class="adjust-btn" id="plusBtn" onclick="adjustTime(1)">+</button>
    </div>

    <div class="controls">
      <button class="action-btn" id="startBtn" onclick="toggleTimer()">start</button>
      <button class="action-btn" onclick="resetTimer()">reset</button>
    </div>
  </div>

  <script>
    const MODES = {
      pomodoro: { name: 'Focus', minutes: 24 },
      shortBreak: { name: 'Short Break', minutes: 5 },
      longBreak: { name: 'Long Break', minutes: 15 }
    };

    let currentMode = 'pomodoro';
    let totalSeconds = MODES[currentMode].minutes * 60;
    let remainingSeconds = totalSeconds;
    let isRunning = false;
    let timerId = null;
    let endTime = null;

    const timeDisplay = document.getElementById('timeDisplay');
    const startBtn = document.getElementById('startBtn');
    const minusBtn = document.getElementById('minusBtn');
    const plusBtn = document.getElementById('plusBtn');
    const sunIcon = document.getElementById('sunIcon');
    const moonIcon = document.getElementById('moonIcon');

    function initTheme() {
      const savedTheme = localStorage.getItem('pomodoroTheme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      updateThemeIcons(savedTheme);
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('pomodoroTheme', newTheme);
      updateThemeIcons(newTheme);
    }

    function updateThemeIcons(theme) {
      if (theme === 'light') {
        sunIcon.style.display = 'none';
        moonIcon.style.display = 'block';
      } else {
        sunIcon.style.display = 'block';
        moonIcon.style.display = 'none';
      }
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = (sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function updateDisplay() {
      timeDisplay.textContent = formatTime(remainingSeconds);
      document.title = `${formatTime(remainingSeconds)} • ${MODES[currentMode].name}`;
    }

    function tick() {
      const now = Date.now();
      remainingSeconds = Math.max(0, Math.round((endTime - now) / 1000));

      updateDisplay();

      if (remainingSeconds <= 0) {
        completeTimer();
      }
    }

    function toggleTimer() {
      if (isRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
    }

    function startTimer() {
      if (remainingSeconds <= 0) return;

      isRunning = true;
      endTime = Date.now() + (remainingSeconds * 1000);
      
      startBtn.textContent = 'pause';
      minusBtn.disabled = true;
      plusBtn.disabled = true;

      timerId = setInterval(tick, 200);
    }

    function pauseTimer() {
      isRunning = false;
      clearInterval(timerId);
      
      startBtn.textContent = 'resume';
      minusBtn.disabled = false;
      plusBtn.disabled = false;
    }

    function resetTimer() {
      pauseTimer();
      remainingSeconds = totalSeconds;
      startBtn.textContent = 'start';
      updateDisplay();
    }

    function completeTimer() {
      pauseTimer();
      startBtn.textContent = 'start';
      playNotification();
    }

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('onclick').includes(mode));
      });

      totalSeconds = MODES[mode].minutes * 60;
      resetTimer();
    }

    function adjustTime(amountMinutes) {
      if (isRunning) return;
      
      const newMinutes = Math.max(1, Math.min(120, Math.floor(totalSeconds / 60) + amountMinutes));
      totalSeconds = newMinutes * 60;
      remainingSeconds = totalSeconds;
      updateDisplay();
    }

    function playNotification() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(659.25, ctx.currentTime + 0.15);
        osc.frequency.exponentialRampToValueAtTime(783.99, ctx.currentTime + 0.3);

        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + 1.2);
      } catch (e) {}
    }

    initTheme();
    updateDisplay();
  </script>
</body>
</html>
